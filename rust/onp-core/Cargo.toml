[package]
name = "onp-core"
version = "1.0.0"
edition = "2021"
authors = ["Opela Nexus Architecture Group"]
description = "Core protocol framing, cryptography, and polymorphic opcode engine for Opela Nexus Protocol (ONP)"
license = "MIT"

[dependencies]
chacha20poly1305 = { version = "0.10", features = ["alloc"] }
x25519-dalek = { version = "2.0", features = ["static_secrets"] }
hkdf = "0.12"
sha2 = "0.10"
hmac = "0.12"
rand = "0.8"
thiserror = "1.0"
bytes = "1.5"

[dev-dependencies]
tokio = { version = "1.36", features = ["full"] }
